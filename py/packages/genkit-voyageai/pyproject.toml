[project]
authors = [{ name = "Google" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
  "License :: OSI Approved :: Apache Software License",
]
# Floor is the release this plugin was written and tested against; the async
# client must expose contextualized_embed(chunk_size=...) and
# multimodal_embed(output_dimension=...).
dependencies = ["genkit>=0.13.0,<2", "pydantic>=2.11", "voyageai>=0.6.0,<1"]
description = "Voyage AI on Genkit"
keywords = [
  "genkit",
  "voyageai",
  "voyage",
  "embeddings",
]
license = "Apache-2.0"
name = "genkit-voyageai"
readme = "README.md"
requires-python = ">=3.10"
version = "0.13.0"

[project.urls]
"Bug Tracker"   = "https://github.com/genkit-ai/genkit/issues"
Changelog       = "https://github.com/genkit-ai/genkit/releases"
"Documentation" = "https://genkit.dev/docs/get-started/?lang=python"
"Homepage"      = "https://github.com/genkit-ai/genkit"
"Repository"    = "https://github.com/genkit-ai/genkit/tree/main/py"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
only-include = ["src/genkit_voyageai"]
sources      = ["src"]
